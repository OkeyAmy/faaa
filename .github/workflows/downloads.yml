name: downloads

# GitHub exposes no download history, only current counters, so this appends a
# point and redraws the chart. Weekly is enough for a trend line; run it by hand
# with `gh workflow run downloads` if you want a point now.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: downloads

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./scripts/downloads
      - name: commit if changed
        run: |
          if git diff --quiet -- assets/downloads.json assets/downloads.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/downloads.json assets/downloads.svg
          git commit -m "chore: refresh download chart"
          git push
