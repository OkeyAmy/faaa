name: scrape trending sounds
on:
  schedule: [{ cron: "17 */6 * * *" }]   # every 6h
  workflow_dispatch:
  push:
    paths: ["community/**", "scraper/**"]
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go run ./scraper
      - name: commit if changed
        run: |
          git diff --quiet -- internal/catalog/index.json && exit 0
          git config user.name "faaa-bot"
          git config user.email "faaa-bot@users.noreply.github.com"
          git add internal/catalog/index.json
          git commit -m "chore: refresh trending sounds"
          git push
