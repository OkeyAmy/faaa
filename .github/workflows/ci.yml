name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o faaa-bin ./cmd/faaa
      - name: e2e (real git push/fetch/reject)
        if: runner.os != 'Windows'
        run: sh scripts/e2e.sh ./faaa-bin
