version: 2
builds:
  - main: ./cmd/faaa
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "faaa_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE]
checksum:
  name_template: checksums.txt
changelog:
  use: github
